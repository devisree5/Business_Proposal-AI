services:
  # Backend FastAPI Web Service
  - type: web
    name: proposalgen-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && playwright install chromium --with-deps"
    startCommand: "python backend/run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proposalgen-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: COMPANY_NAME
        value: "Anvayuone"
      - key: BOT_NAME
        value: "Anvayuone bot"
      - key: COMPANY_EMAIL
        value: "anyaforgerrrr345@gmail.com"
      - key: GMAIL_SALES_EMAIL
        value: "anyaforgerrrr345@gmail.com"

databases:
  - name: proposalgen-db
    databaseName: proposalgen
    user: proposalgen_user
    plan: free
